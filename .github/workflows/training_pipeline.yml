# ==============================================================================
# Workflow Name: 10Pearls AQI Predictor - Automated Training Pipeline
# Description: Automates the end-to-end model training lifecycle on a daily schedule.
#              Fetches historical and latest features from Hopsworks Feature Store,
#              trains the machine learning model, and registers the artifacts.
# ==============================================================================

name: Production AQI Training Pipeline

on:
  # Automated Schedule: Executes daily at midnight UTC (00:00)
  schedule:
    - cron: '0 0 * * *'

  # Manual Trigger: Allows on-demand execution from the GitHub Actions UI
  workflow_dispatch:

jobs:
  execute-training-pipeline:
    name: Fetch Data, Train Model and Push to Registry
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code onto the runner workspace
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up the designated Python environment version
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Upgrade pip and install all required project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyarrow
          pip install -r requirements.txt

      # Step 4: Execute the core model tuning and training script
      - name: Run Model Training Script
        env:
          # Securely inject Hopsworks API key from GitHub repository secrets
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python src/tune_xgboost.py
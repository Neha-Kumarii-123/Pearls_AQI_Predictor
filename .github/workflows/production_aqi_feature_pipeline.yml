# ==============================================================================
# Workflow Name: 10Pearls AQI Predictor - Automated Feature Pipeline
# Description: This GitHub Actions workflow automates the execution of the 
#              feature engineering and ingestion pipeline on a fixed cron schedule.
# ==============================================================================

name: Production AQI Feature Pipeline

# Trigger conditions for the workflow
on:
  # Schedule: Runs automatically every hour (UTC) to ingest fresh weather telemetry
  schedule:
     - cron: '17 * * * *' 

  # Manual Trigger: Allows developers to trigger the pipeline manually from the GitHub UI
  workflow_dispatch:

# Define execution jobs
jobs:
  execute-feature-pipeline:
    name: Fetch, Process and Push Features
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code so the runner can access scripts
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up the targeted Python runtime environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache pip dependencies to speed up subsequent workflow runs

      # Step 3: Install all required production Python packages for data ingestion and cloud sync
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyarrow
          pip install -r requirements.txt

      # Step 4: Execute the feature pipeline script securely injecting GitHub Secrets
      - name: Run Feature Pipeline Script
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
         
        run: |
          python -m src.feature_pipeline